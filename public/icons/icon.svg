<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0074d9" stroke="#005fa3" stroke-width="8"/>
  
  <!-- Book icon -->
  <g transform="translate(128, 128)">
    <!-- Book cover -->
    <rect x="0" y="20" width="120" height="160" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
    
    <!-- Book pages -->
    <rect x="8" y="28" width="104" height="144" fill="#f8f9fa"/>
    
    <!-- Book spine -->
    <rect x="0" y="20" width="20" height="160" rx="8" fill="#005fa3"/>
    
    <!-- Text lines on book -->
    <rect x="20" y="40" width="60" height="3" fill="#333" rx="1"/>
    <rect x="20" y="50" width="70" height="3" fill="#333" rx="1"/>
    <rect x="20" y="60" width="50" height="3" fill="#333" rx="1"/>
    <rect x="20" y="80" width="65" height="3" fill="#333" rx="1"/>
    <rect x="20" y="90" width="55" height="3" fill="#333" rx="1"/>
    <rect x="20" y="100" width="45" height="3" fill="#333" rx="1"/>
    
    <!-- Catalog symbol (grid) -->
    <g transform="translate(80, 120)">
      <rect x="0" y="0" width="8" height="8" fill="#0074d9" rx="1"/>
      <rect x="12" y="0" width="8" height="8" fill="#0074d9" rx="1"/>
      <rect x="24" y="0" width="8" height="8" fill="#0074d9" rx="1"/>
      <rect x="0" y="12" width="8" height="8" fill="#0074d9" rx="1"/>
      <rect x="12" y="12" width="8" height="8" fill="#0074d9" rx="1"/>
      <rect x="24" y="12" width="8" height="8" fill="#0074d9" rx="1"/>
    </g>
  </g>
  
  <!-- App name -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Catalog</text>
</svg>
