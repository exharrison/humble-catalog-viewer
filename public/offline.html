<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Humble Catalog Viewer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-container {
            max-width: 500px;
            text-align: center;
            padding: 2rem;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.7;
        }
        .offline-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }
        .btn-retry {
            background: #0074d9;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-retry:hover {
            background: #005fa3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 116, 217, 0.3);
        }
        .feature-list {
            text-align: left;
            margin: 1.5rem 0;
        }
        .feature-item {
            display: flex;
            align-items: center;
            margin: 0.5rem 0;
            color: #6c757d;
        }
        .feature-icon {
            margin-right: 0.75rem;
            color: #0074d9;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-card">
            <div class="offline-icon">📚</div>
            <h1 class="h3 mb-3">You're Offline</h1>
            <p class="text-muted mb-4">
                Don't worry! You can still browse your catalog using cached data.
            </p>
            
            <div class="feature-list">
                <h6 class="fw-bold mb-3">What you can still do:</h6>
                <div class="feature-item">
                    <i class="bi bi-book feature-icon"></i>
                    <span>Browse previously viewed bundles</span>
                </div>
                <div class="feature-item">
                    <i class="bi bi-search feature-icon"></i>
                    <span>Search through cached book titles</span>
                </div>
                <div class="feature-item">
                    <i class="bi bi-eye feature-icon"></i>
                    <span>View book details and descriptions</span>
                </div>
                <div class="feature-item">
                    <i class="bi bi-filter feature-icon"></i>
                    <span>Filter and sort your collection</span>
                </div>
            </div>
            
            <div class="d-grid gap-2">
                <button class="btn btn-retry" onclick="window.location.reload()">
                    <i class="bi bi-arrow-clockwise me-2"></i>Try Again
                </button>
                <button class="btn btn-outline-secondary" onclick="window.history.back()">
                    <i class="bi bi-arrow-left me-2"></i>Go Back
                </button>
            </div>
            
            <div class="mt-4">
                <small class="text-muted">
                    <i class="bi bi-info-circle me-1"></i>
                    New bundles and downloads require an internet connection
                </small>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</body>
</html>
